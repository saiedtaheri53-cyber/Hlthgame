<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی کلمات طب</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1b4332 0%, #081c15 100%);
            --card-bg: rgba(255, 255, 255, 0.1);
            --accent-gold: linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            --text-gold: linear-gradient(to right, #f9d423, #ff4e50);
            --primary-green: #2d6a4f;
            --secondary-green: #40916c;
            --accent-orange: #fb8500;
            --accent-blue: #00b4d8;
            --accent-red: #e63946;
            --accent-purple: #7209b7;
            --text-white: #f8f9fa;
        }

        * { box-sizing: border-box; font-family: 'Tahoma', 'Arial', sans-serif; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-gradient);
            color: var(--text-white);
            overflow-x: hidden;
        }

        .app {
            width: 95%;
            max-width: 500px;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ffd700, #ffa500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .status-item {
            background: rgba(0,0,0,0.3);
            padding: 5px 15px;
            border-radius: 15px;
        }

        .category-tag {
            background: var(--primary-green);
            padding: 5px 15px;
            border-radius: 15px;
            display: inline-block;
            margin-bottom: 15px;
            font-size: 0.85rem;
        }

        #letters {
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 8px;
            background: white;
            color: #1b4332;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
            word-break: break-all;
        }

        .info-area {
            min-height: 40px;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .hint-text { color: var(--accent-blue); }
        .answer-text { color: var(--accent-red); }
        .success-text { color: #74c69d; }

        input[type="text"] {
            width: 100%;
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            margin-bottom: 15px;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            cursor: pointer;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            transition: transform 0.1s, opacity 0.2s;
            color: white;
        }

        button:active { transform: scale(0.95); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-submit { background: var(--accent-orange); grid-column: span 2; font-size: 1.1rem; }
        .btn-hint { background: var(--accent-blue); }
        .btn-answer { background: var(--accent-red); }
        .btn-prev { background: #6c757d; }
        .btn-next { background: var(--secondary-green); }
        .btn-share { background: var(--accent-purple); grid-column: span 2; margin-top: 10px; }

        .overlay {
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .card {
            background: #1b4332;
            padding: 40px 30px;
            border-radius: 30px;
            max-width: 85%;
            text-align: center;
            border: 2px solid #ffd700;
        }

        .message { margin-top: 10px; font-size: 0.9rem; height: 20px; }

        @media (max-width: 400px) {
            h1 { font-size: 1.5rem; }
            #letters { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

<div class="app">
    <h1>🌿 بازی کلمات طب</h1>
    
    <div class="status-bar">
        <div class="status-item">امتیاز: <span id="score-val">۱۰۰۰</span></div>
        <div class="status-item">مرحله: <span id="level-val">۱</span>/<span id="total-val">۱۰۰</span></div>
    </div>

    <div id="category" class="category-tag">دسته: ...</div>

    <div id="letters">---</div>

    <div id="info-area" class="info-area"></div>

    <input type="text" id="answer-input" placeholder="پاسخ را بنویسید..." autocomplete="off">

    <div class="btn-grid">
        <button class="btn-submit" onclick="submitAnswer()">ارسال پاسخ</button>
        <button class="btn-hint" onclick="useHint()">💡 راهنما (−۱۰)</button>
        <button class="btn-answer" onclick="useAnswer()">📖 جواب (−۲۰)</button>
        <button class="btn-prev" onclick="prevWord()">قبلی</button>
        <button class="btn-next" onclick="nextWord()">بعدی</button>
        <button class="btn-share" onclick="shareGame()">🔗 اشتراک‌گذاری</button>
    </div>

    <div id="msg" class="message"></div>
</div>

<div id="overlay" class="overlay">
    <div class="card">
        <h2 id="finish-title">🎉 آفرین!</h2>
        <p id="finish-msg">همه‌ی ۱۰۰ کلمه را با موفقیت حل کردی.</p>
        <h3 id="final-score-text">امتیاز نهایی: ۰</h3>
        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
            <button onclick="restartGame()" style="background: var(--secondary-green);">شروع دوباره</button>
            <button onclick="shareGame()" style="background: var(--accent-purple);">اشتراک‌گذاری</button>
        </div>
    </div>
</div>

<script>
    // دیتابیس ۱۰۰ کلمه جدید و تخصصی
    const WORDS = [
        // ارکان و مزاج (۱-۱۵)
        {w:"آتش", c:"ارکان", h:"عنصر گرم و خشک"},

        // گیاهان دارویی (۱۶-۴۵)

        {w:"هل", c:"گیاهان", h:"خوشبو کننده و گرم"},

        {w:"زیره", c:"گیاهان", h:"برای رفع نفخ و گوارش"},
        {w:"کندر", c:"گیاهان", h:"تقویت کننده ریه و سیستم ایمنی"},
        {w:"شنبلیله", c:"گیاهان", h:"برای تنظیم قند و افزایش شیر"},
        {w:"مرزنجوش", c:"گیاهان", h:"گیاه محبوب در طب سنتی برای تنفس"},
        {w:"شیرین‌بیان", c:"گیاهان", h:"برای معده و گلو"},
        {w:"گزنه", c:"گیاهان", h:"تقویت کننده خون و رفع حساسیت"},
        {w:"بادرنجبویه", c:"گیاهان", h:"آرام‌بخش اعصاب"},
        {w:"نارنج", c:"گیاهان", h:"میوه با طعم ترش"},
        {w:"انار", c:"گیاهان", h:"تقویت کننده خون و ضد سرطان"},
        {w:"گل‌محمدی", c:"گیاهان", h:"برای قلب و آرامش"},
        {w:"پودر", c:"گیاهان", h:"فرآیند تبدیل گیاه به پودر"},
        {w:"ریحان", c:"گیاهان", h:"آرام‌بخش و خوشبو"},
        {w:"مریم‌گلی", c:"گیاهان", h:"برای تنظیم هورمون‌ها"},
        {w:"گون", c:"گیاهان", h:"برای تنظیم قند خون"},
        {w:"خالص", c:"گیاهان", h:"بدون ناخالصی"},
        {w:"کاکل", c:"گیاهان", h:"بخش گیاهی"},
        {w:"ریشه", c:"گیاهان", h:"بخش زیرزمینی گیاه"},
        {w:"ساقه", c:"گیاهان", h:"بخش میانی گیاه"},
        {w:"برگ", c:"گیاهان", h:"بخش سبز گیاه"},

        // ستۀ ضروریه و سلامت (۴۶-۶۵)
        {w:"خواب", c:"سته ضروریه", h:"نیاز حیاتی بدن"},
        {w:"غذا", c:"سته ضروریه", h:"سوخت بدن"},
        {w:"حرکت", c:"سته ضروریه", h:"ضد سکون"},
        {w:"سکون", c:"سته ضروریه", h:"ضد حرکت"},
        {w:"تنفس", c:"سته ضروریه", h:"تبادل گازها"},
        {w:"خون", c:"سته ضروریه", h:"حامل اکسیژن"},
        {w:"تعریق", c:"سته ضروریه", h:"راه خروج سموم"},
        {w:"حرارت", c:"سته ضروریه", h:"دمای بدن"},
        {w:"تبadel", c:"سته ضروریه", h:"تغییرات بدن"},
        {w:"ورزش", c:"سته ضروریه", h:"تقویت بدن"},
        {w:"آرامش", c:"سته ضروریه", h:"حالت روانی سلامت"},
        {w:"بیداری", c:"سته ضروریه", h:"ضد خواب"},
        {w:"استراحت", c:"سته ضروریه", h:"بازسازی توان"},
        {w:"تعادل", c:"سته ضروریه", h:"حالت مطلوب"},
        {w:"هضم", c:"سته ضروریه", h:"تبدیل غذا به انرژی"},
        {w:"تغذیه", c:"سته ضروریه", h:"فرآیند دریافت غذا"},
        {w:"پاکسازی", c:"سته ضروریه", h:"رفع سموم"},
        {w:"خواب‌آور", c:"سته ضروریه", h:"عامل ایجاد خواب"},
        {w:"تنش", c:"سته ضروریه", h:"ضد آرامش"},
        {w:"سلامت", c:"سته ضروریه", h:"حالت مطلوب بدن"},

        // اعضا و مفاهیم طب (۶۶-۱۰۰)
        {w:"قلب", c:"اعضا", h:"پمپ خون"},
        {w:"کبد", c:"اعضا", h:"مرکز متابولیسم"},
        {w:"معده", c:"اعضا", h:"محل هضم غذا"},
        {w:"کلیه", c:"اعضا", h:"فیلتر خون"},
        {w:"ریه", c:"اعضا", h:"مرکز تنفس"},
        {w:"مغز", c:"اعضا", h:"مرکز فرماندهی"},
        {w:"طحال", c:"اعضا", h:"مرکز خون‌سازی"},
        {w:"روده", c:"اعضا", h:"جذب مواد"},
        {w:"کبد", c:"اعضا", h:"اندام اصلی گوارش"},
        {w:"پوست", c:"اعضا", h:"بزرگترین عضو بدن"},
        {w:"عصب", c:"اعضا", h:"انتقال پیام"},
        {w:"استخوان", c:"اعضا", h:"ساختار بدن"},
        {w:"ماهیچه", c:"اعضا", h:"عامل حرکت"},
        {w:"شریان", c:"اعضا", h:"رگ حامل خون تازه"},
        {w:"ورید", c:"اعضا", h:"رگ حامل خون کهنه"},
        {w:"مفصل", c:"اعضا", h:"اتصال استخوان‌ها"},
        {w:"مخ", c:"اعضا", h:"بخش اصلی مغز"},
        {w:"گلو", c:"اعضا", h:"مسیر غذا و هوا"},
        {w:"بینی", c:"اعضا", h:"مرکز بویایی"},
        {w:"گوش", c:"اعضا", h:"مرکز شنوایی"},
        {w:"چشم", c:"اعضا", h:"مرکز بینایی"},
        {w:"زبان", c:"اعضا", h:"مرکز چشایی"},
        {w:"دندان", c:"اعضا", h:"ابزار جویدن"},
        {w:"کبد", c:"اعضا", h:"اندام اصلی"},
        {w:"صفرا", c:"اعضا", h:"مایع گوارشی"},
        {w:"باند", c:"درمان", h:"ابزار بستن زخم"},
        {w:"دارو", c:"درمان", h:"عامل درمان"},
        {w:"شربت", c:"درمان", h:"داروی مایع"},
        {w:"پماد", c:"درمان", h:"داروی موضعی"},
        {w:"ضماد", c:"درمان", h:"داروی گیاهی"},
        {w:"تشنج", c:"بیماری", h:"لرزش ناگهانی"},
        {w:"تب", c:"بیماری", h:"افزایش دمای بدن"},
        {w:"درد", c:"بیماری", h:"سیگنال آسیب"},
        {w:"سرفه", c:"بیماری", h:"واکنش ریه"},
        {w:"خارش", c:"بیماری", h:"واکنش پوست"},
        {w:"تورم", c:"بیماری", h:"افزایش حجم عضو"},
        {w:"یبوست", c:"بیماری", h:"دیر بودن دفع"},
        {w:"اسهال", c:"بیماری", h:"دفع سریع"},
        {w:"خونریزی", c:"بیماری", h:"خارج شدن خون"},
        {w:"سرگیجه", c:"بیماری", h:"عدم تعادل"},
        {w:"خستگی", c:"بیماری", h:"کمبود انرژی"},
        {w:"بی‌خوابی", c:"بیماری", h:"عدم توان خواب"},
        {w:"سردرد", c:"بیماری", h:"درد در سر"},
        {w:"تپش", c:"بیماری", h:"ضربان قلب"},
        {w:"لرز", c:"بیماری", h:"ارتعاش بدن"}
    ];

    // Constants & State
    const START_SCORE = 1000;
    const AWARD = 10;
    const HINT_COST = 10;
    const ANSWER_COST = 20;
    const TOTAL = WORDS.length;

    let state = {
        score: START_SCORE,
        index: 0,
        answered: {}, // {index: true}
        hintsUsed: {}, // {index: count}
        answersUsed: {}, // {index: count}
        isFinished: false
    };

    // Utils
    const toFa = (n) => n.toString().replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
    const fromFa = (s) => s.replace(/[۰-۹]/g, d => "0123456789"[د]);

    function scramble(word) {
        let letters = word.split('');
        for (let i = letters.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [letters[i], letters[j]] = [letters[j], letters[i]];
        }
        let scrambled = letters.join('');
        return (scrambled === word) ? scramble(word) : scrambled;
    }

    // Core Logic
    function init() {
        const saved = localStorage.getItem('tibb_game_v2');
        if (saved) {
            state = JSON.parse(saved);
            if (state.isFinished) {
                showOverlay();
            }
        }
        render();
    }

    function save() {
        localStorage.setItem('tibb_game_v2', JSON.stringify(state));
    }

    function render() {
        const current = WORDS[state.index];
        document.getElementById('score-val').innerText = toFa(state.score);
        document.getElementById('level-val').innerText = toFa(state.index + 1);
        document.getElementById('total-val').innerText = toFa(TOTAL);
        document.getElementById('category').innerText = `دسته: ${current.c}`;
        document.getElementById('answer-input').value = "";
        document.getElementById('info-area').innerHTML = "";
        document.getElementById('msg').innerText = "";

        const lettersDiv = document.getElementById('letters');
        
        if (state.answered[state.index] || state.answersUsed[state.index]) {
            lettersDiv.innerText = current.w;
            lettersDiv.style.color = "#74c69d";
            if (state.answered[state.index]) {
                document.getElementById('info-area').innerHTML = `<span class="success-text">✅ پاسخ داده شده</span>`;
            } else {
                document.getElementById('info-area').innerHTML = `<span class="answer-text">✅ جواب: ${current.w}</span>`;
            }
        } else {
            lettersDiv.innerText = scramble(current.w);
            lettersDiv.style.color = "#1b4332";
        }

        // Show hint if used
        if (state.hintsUsed[state.index]) {
            document.getElementById('info-area').innerHTML += `<br><span class="hint-text">💡 راهنما: ${current.h}</span>`;
        }

        // Check finish condition
        if (state.index === TOTAL - 1 && Object.keys(state.answered).length === TOTAL) {
            // Not necessarily finished if they haven't reached the end, 
            // but the logic usually triggers when the user answers the last one.
        }
    }

    function submitAnswer() {
        if (state.isFinished) return;
        const input = document.getElementById('answer-input').value.trim();
        const current = WORDS[state.index];
        const msg = document.getElementById('msg');

        if (!input) {
            msg.innerText = "لطفاً پاسخ را بنویسید.";
            msg.style.color = "var(--accent-red)";
            return;
        }

        if (state.answered[state.index]) {
            msg.innerText = "این کلمه را قبلاً پاسخ داده‌ای.";
            return;
        }

        if (input === current.w) {
            state.score += AWARD;
            state.answered[state.index] = true;
            msg.innerText = "🎉 درست بود! +" + AWARD;
            msg.style.color = "#74c69d";
            
            // Check if game ends
            if (Object.keys(state.answered).length === TOTAL) {
                state.isFinished = true;
                showOverlay();
            } else {
                setTimeout(() => {
                    state.index++;
                    render();
                    save();
                }, 1000);
            }
        } else {
            msg.innerText = "❌ پاسخ درست نیست؛ دوباره تلاش کن.";
            msg.style.color = "var(--accent-red)";
        }
        save();
    }

    function useHint() {
        if (state.score < HINT_COST) {
            document.getElementById('msg').innerText = "امتیاز کافی نداری.";
            return;
        }
        if (state.hintsUsed[state.index]) {
            document.getElementById('msg').innerText = "قبلاً برای این کلمه راهنما گرفتی.";
            return;
        }
        state.score -= HINT_COST;
        state.hintsUsed[state.index] = true;
        render();
        save();
    }

    function useAnswer() {
        if (state.score < ANSWER_COST) {
            document.getElementById('msg').innerText = "امتیاز کافی نداری.";
            return;
        }
        if (state.answersUsed[state.index]) {
            document.getElementById('msg').innerText = "جواب همین بالاست؛ دوباره پرداخت نمی‌کنی.";
            return;
        }
        state.score -= ANSWER_COST;
        state.answersUsed[state.index] = true;
        render();
        save();
    }

    function prevWord() {
        if (state.index > 0) {
            state.index--;
            render();
            save();
        }
    }

    function nextWord() {
        if (state.index < TOTAL - 1) {
            state.index++;
            render();
            save();
        }
    }

    function showOverlay() {
        document.getElementById('overlay').style.display = 'flex';
        document.getElementById('final-score-text').innerText = `امتیاز نهایی: ${toFa(state.score)}`;
    }

    function restartGame() {
        localStorage.removeItem('tibb_game_v2');
        state = {
            score: START_SCORE,
            index: 0,
            answered: {},
            hintsUsed: {},
            answersUsed: {},
            isFinished: false
        };
        document.getElementById('overlay').style.display = 'none';
        render();
    }

    function shareGame() {
        const text = `🌿 بازی کلمات طب\nامتیاز من: ${toFa(state.score)}\nمرحله: ${toFa(state.index + 1)} از ${toFa(TOTAL)}\nآیا می‌توانی امتیاز من را شکست دهی؟`;
        if (navigator.share) {
            navigator.share({ title: 'بازی کلمات طب', text: text });
        } else {
            navigator.clipboard.writeText(text);
            alert("متن کپی شد! می‌توانید در واتس‌اپ یا تلگرام ارسال کنید.");
        }
    }

    // Handle Enter key
    document.getElementById('answer-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') submitAnswer();
    });

    init();
</script>

</body>
</html>
